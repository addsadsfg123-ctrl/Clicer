<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диана ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <h1>Для Дианы 💕</h1>

    <div class="counter">
        Открыто: <span id="count">0</span> / 180
    </div>

    <button id="heart">
    <span class="pixel-heart-button"></span>
</button>

    <div id="compliment">
        Нажми на сердце ✨
    </div>

</div>

<div id="ending">

    <div class="ending-box">

        <h2>🎉 Диана, ты открыла всё 🎉</h2>

        <p>
        180 маленьких напоминаний<br>
        о том, какая ты замечательная ❤️
        </p>

        <div id="credits">
            Создано с теплом ✨
        </div>

        <button id="restart">
            Начать заново 💕
        </button>

    </div>

</div>
<script src="compliments.js"></script>
<script src="script.js"></script>

</body>
</html>
